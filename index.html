<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AMÉRYS Phu Quoc — The Stamp Playbook</title>
<meta name="description" content="Hướng dẫn tham gia các trạm trong Togetherness Passport tại AMÉRYS Boutique Hotel Phu Quoc.">
<meta name="theme-color" content="#024668">
<meta property="og:title" content="THE STAMP PLAYBOOK — AMÉRYS Phu Quoc">
<meta property="og:description" content="Tự do chọn trải nghiệm, thỏa sức săn tem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600&family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#024668;--teal:#06859d;--aqua:#b4d5d8;--sand:#eaddca;--terra:#bf704c;--paper:#fbf8f3;--muted:#7a8a93;--line:rgba(2,70,104,.12);--gut:clamp(16px,5vw,24px);--tb:64px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;scroll-padding-top:calc(var(--tb) + 52px)}
html,body{margin:0;padding:0;background:#eef4f4;-webkit-font-smoothing:antialiased}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--navy)}
a{color:var(--teal);text-decoration:none}
a:hover{color:var(--navy)}
::selection{background:var(--aqua);color:var(--navy)}
button{font-family:inherit}
svg{display:block}
.shell{min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:520px;background:var(--paper);min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(2,70,104,.10)}
main{flex:1 0 auto}
body.home .hero{min-height:calc(100dvh - var(--tb,64px));display:flex;flex-direction:column;justify-content:center}
body.home .fade{height:100%}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px var(--gut);background:rgba(251,248,243,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:2px 0;cursor:pointer;color:var(--navy)}
.logo .mk{width:44px;color:var(--navy)}
.logo .nm{font-family:Montserrat,sans-serif;font-weight:300;font-size:17px;letter-spacing:.3em;line-height:1;text-indent:.3em}
.logo .pl{font-family:Montserrat,sans-serif;font-weight:400;font-size:7px;letter-spacing:.34em;color:var(--teal);text-indent:.34em}
.pill{display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid rgba(2,70,104,.18);border-radius:999px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);line-height:1.2;white-space:nowrap;flex:none}
.dot{width:6px;height:6px;border-radius:50%;background:var(--terra);flex:none}
.hero{position:relative;overflow:hidden;background:var(--navy);padding:clamp(34px,8vw,54px) var(--gut) 0;color:var(--paper)}
.hero .ring{position:absolute;right:-70px;top:-70px;width:220px;height:220px;border:1px solid rgba(180,213,216,.3);border-radius:50%;pointer-events:none}
.hero .bgwave{position:absolute;left:-6%;right:-6%;bottom:46px;color:rgba(180,213,216,.18);pointer-events:none}
.hero .in{position:relative;padding-bottom:clamp(30px,8vw,46px)}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--aqua)}
h1{font-family:Montserrat,sans-serif;font-weight:200;font-size:clamp(34px,10.5vw,46px);line-height:1.03;letter-spacing:.02em;margin:18px 0 0;text-wrap:balance}
h1 b{font-weight:500}
.wmark{color:var(--aqua);width:clamp(96px,30vw,132px);margin:18px 0 22px}
.hero p{max-width:40ch}
.hero .pen{margin:0 0 15px;font-size:clamp(12px,3.2vw,13px);line-height:1.6;color:rgba(251,248,243,.84);font-style:italic}
.hero .pvi{margin:0;font-size:clamp(13px,3.5vw,14px);line-height:1.62}
.cta{margin-top:28px;width:100%;max-width:360px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 18px;background:var(--terra);color:var(--paper);border:0;border-radius:2px;cursor:pointer;text-align:left;min-height:56px;transition:background .18s,color .18s,box-shadow .18s}
.cta:hover{background:var(--paper);color:var(--navy);box-shadow:0 10px 26px rgba(0,0,0,.2)}
.cta .l1{display:block;font-size:14px;font-weight:500;letter-spacing:.03em}
.cta .l2{display:block;font-size:11px;font-style:italic;letter-spacing:.06em;margin-top:3px;opacity:.78}
.cta .ar{font-size:18px;flex:none}
.wdiv{color:var(--aqua);width:100%;max-width:240px;margin:0 auto}
.sec{padding:clamp(22px,6vw,30px) var(--gut) clamp(34px,9vw,46px)}
.ohead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.ohead h2{font-family:Montserrat,sans-serif;font-weight:300;font-size:clamp(23px,7vw,28px);letter-spacing:.06em;margin:0}
.ohead span{font-size:10.5px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase}
.olead{margin:0 0 20px;font-size:12.5px;color:var(--muted);line-height:1.6}
.cards{display:flex;flex-direction:column;gap:10px}
.card{position:relative;display:flex;gap:14px;align-items:center;padding:14px 14px 14px 16px;background:#fff;border:1px solid var(--line);border-radius:3px;cursor:pointer;overflow:hidden;text-align:left;font:inherit;color:inherit;width:100%;min-height:76px;-webkit-tap-highlight-color:transparent;transition:transform .18s cubic-bezier(.2,0,.2,1),box-shadow .18s,border-color .18s}
.card:hover,.card:active{transform:translateY(-2px);box-shadow:0 12px 26px rgba(2,70,104,.13);border-color:var(--teal)}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:3px}
.stamp{position:relative;flex:none;width:50px;height:50px;border-radius:50%;border:1px dashed currentColor;display:flex;align-items:center;justify-content:center}
.card .tag{font-family:Montserrat,sans-serif;font-size:9.5px;letter-spacing:.18em;margin-bottom:4px;display:block}
.card .vi{display:block;font-size:14.5px;font-weight:600;line-height:1.32}
.card .cen{display:block;font-size:12px;font-style:italic;color:var(--muted);margin-top:2px}
.card .locline{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.card .arrow{flex:none;font-size:17px;color:var(--aqua)}
.ico{display:block;background-color:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.tabs{position:sticky;top:var(--tb,64px);z-index:20;display:flex;overflow-x:auto;background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:6px;min-height:46px;padding:12px 14px 10px;cursor:pointer;white-space:nowrap;font:400 12px 'Be Vietnam Pro',sans-serif;letter-spacing:.05em;color:#8f9ba2;background:transparent;border:0;border-bottom:2px solid transparent;transition:color .18s,background .18s}
.tab:hover{background:#f1ece3;color:var(--navy)}
.tab.on{color:var(--navy);background:#fff;font-weight:600}
.tab .num{font-family:Montserrat,sans-serif;opacity:.6}
.dband{position:relative;overflow:hidden;background:var(--navy);color:var(--paper);padding:clamp(24px,7vw,34px) var(--gut) clamp(30px,8vw,40px)}
.dband .bgwave{position:absolute;left:-8%;right:-8%;bottom:-10px;color:rgba(180,213,216,.2)}
.dband .num{position:relative;font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:.24em;color:var(--aqua)}
.dband .big{position:relative;display:flex;align-items:center;gap:14px;margin-top:14px}
.dband .sq{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--paper)}
.dband .den{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--aqua);margin-bottom:5px}
h2.title{margin:0;font-family:Montserrat,sans-serif;font-weight:400;font-size:clamp(20px,6vw,25px);line-height:1.16;letter-spacing:.02em;text-wrap:balance}
.detail{padding:clamp(22px,6vw,28px) var(--gut) clamp(38px,10vw,54px)}
.kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--terra);margin-bottom:12px}
.tagline{position:relative;padding:16px 18px;background:var(--sand);border-radius:3px;margin:0 0 26px}
.tagline .ten{margin:0 0 5px;font-size:13px;font-style:italic;color:#8a6a4f;line-height:1.55}
.tagline .tvi{margin:0;font-size:14px;font-weight:500;line-height:1.55}
.step{display:flex;gap:14px;padding:14px 4px;border-top:1px solid var(--line);transition:background .18s}
.step:last-of-type{border-bottom:1px solid var(--line)}
.step:hover{background:#f4f8f8}
.step .n{font-family:Montserrat,sans-serif;font-size:12.5px;font-weight:500;color:var(--aqua);min-width:22px}
.step .vi{font-size:14px;font-weight:500;line-height:1.5}
.step .en{font-size:12px;font-style:italic;color:var(--muted);line-height:1.5;margin-top:3px}
.loc{border:1px solid rgba(2,70,104,.16);border-radius:3px;padding:16px 18px;background:#fff}
.locpic{margin:14px -18px -16px;border-top:1px solid rgba(2,70,104,.12);border-radius:0 0 3px 3px;overflow:hidden;background:#e6eff0}
.locpic img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
.loc .lab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#A80D26;margin-bottom:9px}
.loc .vi{font-size:14px;font-weight:500;line-height:1.45}
.loc .en{font-size:12px;font-style:italic;color:var(--muted);margin-top:3px;line-height:1.45}
.note{margin-top:22px;padding:15px 17px;border-left:3px solid var(--terra);background:#fbf3ee;color:#8a6a4f}
.note .nvi{font-size:12.5px;line-height:1.55}
.note .nen{display:block;font-size:11.5px;font-style:italic;line-height:1.5;margin-top:5px;color:#a3866c}
.nav{display:flex;gap:10px;margin-top:26px}
.nav button{flex:1;min-height:52px;padding:11px 8px;text-align:center;border:1px solid rgba(2,70,104,.2);border-radius:2px;cursor:pointer;background:transparent;font:400 12.5px 'Be Vietnam Pro',sans-serif;color:var(--navy);transition:background .18s,color .18s,border-color .18s}
.nav .bvi{display:block;font-size:12.5px;font-weight:500}
.nav .ben{display:block;font-size:10.5px;font-style:italic;opacity:.72;margin-top:2px}
.nav button:hover{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.linkish{display:block;width:100%;margin-top:12px;text-align:center;font:400 12px 'Be Vietnam Pro',sans-serif;letter-spacing:.08em;color:var(--muted);cursor:pointer;background:none;border:0;padding:13px;transition:color .18s}
.linkish .len{display:block;font-size:10.5px;font-style:italic;letter-spacing:.04em;margin-top:3px;opacity:.85}
.linkish:hover{color:var(--navy)}
footer{margin-top:auto;flex:none;padding:clamp(20px,6vw,28px) var(--gut) calc(clamp(22px,6vw,30px) + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--paper)}
footer .flogo{width:clamp(104px,28vw,138px);height:auto}
.fade{animation:fadeIn .35s ease-out both}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-14px)}}
.bgwave{animation:sway 9s ease-in-out infinite}
@media (max-width:400px){.pill span.pt{display:none}.pill{padding:8px 9px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.rhero{position:relative;overflow:hidden;background:var(--navy);color:var(--paper);padding:clamp(28px,8vw,40px) var(--gut) clamp(30px,8vw,42px)}
.rhero .bgwave{position:absolute;left:-8%;right:-8%;bottom:-12px;color:rgba(180,213,216,.2)}
.rhero .eb{position:relative;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--aqua)}
.rhero h2{position:relative;margin:12px 0 0;max-width:474px;font-family:Montserrat,sans-serif;font-weight:300;font-size:clamp(23px,7vw,29px);line-height:1.12;letter-spacing:.02em;text-wrap:balance}
.rhero .hen{position:relative;margin:8px 0 0;max-width:357px;font-size:clamp(12px,3.4vw,13.5px);font-style:italic;color:rgba(251,248,243,.82);line-height:1.5;max-width:40ch}
.rhero .hvi{position:relative;margin:14px 0 0;font-size:clamp(13px,3.5vw,14px);line-height:1.6;max-width:40ch}
.tiers{display:flex;flex-direction:column;gap:clamp(14px,4vw,18px)}
.tier{position:relative;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.tier .top{display:flex;align-items:center;gap:14px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.tier .med{flex:none;width:83px;height:81px;border-radius:50%;border:1px dashed currentColor;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tier .med b{font-family:Montserrat,sans-serif;font-weight:400;font-size:19px}
.tier .med i{font-size:7px;letter-spacing:.14em;font-style:normal;margin-top:3px}
.tier .ten{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;display:block}
.tier h3{margin:5px 0 0;font-family:Montserrat,sans-serif;font-weight:500;font-size:clamp(15px,4.4vw,17px);letter-spacing:.04em;line-height:1.2;color:var(--navy);text-wrap:balance}
.tier .tvi2{display:block;margin-top:3px;font-size:11.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.tier .lead{padding:14px 16px;background:var(--sand)}
.tier .lead .len2{margin:0;font-size:12px;font-style:italic;color:#8a6a4f;line-height:1.5}
.tier .lead .lvi{margin:5px 0 0;font-size:13px;font-weight:500;color:#8E0B20;line-height:1.5}
.tier ul{list-style:none;margin:0;padding:4px 16px 16px}
.tier li{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.tier li:last-child{border-bottom:0}
.tier li .ric{flex:none;width:34px;height:34px;border-radius:50%;background:var(--paper);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.frames{display:flex;gap:clamp(10px,3vw,16px);justify-content:center;padding:18px 16px 4px}
.frame{flex:1 1 0;min-width:0;max-width:170px;background:#fff;padding:7px 7px 24px;border:1px solid var(--line);box-shadow:0 6px 18px rgba(2,70,104,.12);border-radius:2px}
.frame:first-child{transform:rotate(-2.2deg)}
.frame:last-child{transform:rotate(2.4deg)}
.frame .ph{position:relative;aspect-ratio:4/3;background:#e6eff0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#a9c3c7}
.frame .ph img{width:100%;height:100%;object-fit:cover}
.tier li .ren{display:block;font-size:12px;font-weight:500;line-height:1.45;color:var(--navy)}
.tier li .rvi{display:block;font-size:12px;font-style:italic;line-height:1.45;color:var(--muted);margin-top:3px}
.fine{margin-top:22px;text-align:center;font-size:10.5px;color:#9aa8ae;line-height:1.7}
.fine i{display:block;font-size:10px}
.rewardlink{display:flex;align-items:center;gap:13px;width:100%;min-height:84px;margin:0 0 18px;padding:16px;background:#9E2121;color:var(--paper);border:0;border-radius:3px;cursor:pointer;text-align:left;min-height:58px;transition:background .18s,color .18s}
.rewardlink:hover{background:var(--navy)}
.rewardlink .ri{flex:none}
.rewardlink .r1{display:block;font-size:13.5px;font-weight:500;letter-spacing:.03em}
.rewardlink .r2{display:block;font-size:10.5px;font-style:italic;opacity:.8;margin-top:2px}
.rewardlink .ar{margin-left:auto;font-size:17px}
/* ---------- Chế độ soạn thảo (#edit) ---------- */
body.edit{padding-bottom:120px}
body.edit .app{box-shadow:0 0 0 2px var(--terra),0 0 60px rgba(2,70,104,.10)}
[data-path]{outline:1px dashed rgba(191,112,76,.55);outline-offset:3px;border-radius:2px;min-width:14px;transition:outline-color .12s,background .12s}
[data-path]:hover{outline-color:var(--terra);background:rgba(191,112,76,.06)}
[data-path]:focus{outline:2px solid var(--terra);background:rgba(255,255,255,.6)}
.hero [data-path]:focus,.dband [data-path]:focus{background:rgba(0,0,0,.28)}
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--navy);color:var(--paper);box-shadow:0 -6px 24px rgba(2,70,104,.28)}
.ebar .lab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--aqua);margin-right:auto}
.ebtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:9px 13px;border:1px solid rgba(180,213,216,.45);border-radius:2px;background:transparent;color:var(--paper);font:500 12px 'Be Vietnam Pro',sans-serif;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.ebtn:hover{background:var(--paper);color:var(--navy);border-color:var(--paper)}
.ebtn.pri{background:var(--terra);border-color:var(--terra)}
.ebtn.pri:hover{background:var(--paper);color:var(--navy)}
.etools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px;padding:11px 13px;background:#fff;border:1px dashed rgba(191,112,76,.5);border-radius:3px}
.etools .t{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--terra)}
.efield{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.efield input[type=text]{font:400 12px 'Be Vietnam Pro',sans-serif;color:var(--navy);padding:8px 9px;border:1px solid var(--line);border-radius:2px;background:var(--paper);min-width:120px;max-width:180px}
.efield input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:2px;background:none;cursor:pointer}
.efield select{font:400 12px 'Be Vietnam Pro',sans-serif;color:var(--navy);padding:7px 8px;border:1px solid var(--line);border-radius:2px;background:var(--paper)}
.esm{min-height:36px;padding:7px 11px;border:1px solid var(--line);border-radius:2px;background:var(--paper);font:500 11.5px 'Be Vietnam Pro',sans-serif;color:var(--navy);cursor:pointer;transition:background .15s,color .15s}
.esm:hover{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.esm.warn:hover{background:#b3392a;border-color:#b3392a;color:#fff}
.ehint{font-size:11.5px;color:var(--muted);line-height:1.5;margin:0 0 14px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:70;padding:11px 18px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--terra);border-radius:2px;font-size:12.5px;box-shadow:0 8px 24px rgba(2,70,104,.18);animation:fadeIn .16s ease-out both}
</style>
</head>
<body>
<div class="shell"><div class="app">
<div class="topbar">
  <button class="logo" onclick="go('home')" aria-label="AMÉRYS Phu Quoc">
    <span class="mk" id="logomark"></span>
    <span class="nm" id="logoname">AMÉRYS</span>
    <span class="pl" id="logoplace">PHU QUOC</span>
  </button>
  <div class="pill"><span class="dot"></span><span class="pt" id="pillText">Togetherness Passport</span></div>
</div>

function editBar(){
  let el=document.querySelector(".ebar");
  if(!state.edit){if(el)el.remove();document.body.classList.remove("edit");return}
  document.body.classList.add("edit");
  if(el)return;
  el=document.createElement("div");el.className="ebar";
  el.innerHTML='<span class="lab">Chế độ soạn thảo</span>'+
   '<span class="efield" style="color:rgba(251,248,243,.9)">Màu '+
   ["navy","teal","terra","sand","aqua"].map(k=>'<input type="color" data-theme="'+k+'" value="'+(C.theme[k]||"#000000")+'" title="'+k+'">').join("")+'</span>'+
   '<button class="ebtn" data-act="reset">Hoàn tác</button>'+
   '<button class="ebtn" data-act="exit">Xem thử</button>'+
   '<button class="ebtn pri" data-act="download">Tải content.json</button>';
  document.body.appendChild(el);
}

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.path){setPath(t.dataset.path,t.dataset.html?t.innerHTML:t.textContent);return}
  if(t.dataset&&t.dataset.field){setPath(t.dataset.field,t.value);
    if(/\.(color|icon|tab|photo)$/.test(t.dataset.field))render();return}
  if(t.dataset&&t.dataset.theme){C.theme[t.dataset.theme]=t.value;applyTheme();saveDraft()}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,i=+b.dataset.i,k=+b.dataset.k,s=C.stations[state.i];
  if(a==="open"){go("detail",i);return}
  if(a==="go-overview"){go("overview");return}
  if(a==="go-rewards"){go("rewards");return}
  if(a==="go-home"){go("home");return}
  if(a==="addStation"){C.stations.push({tab:"Trạm mới",en:"New station",vi:"TRẠM MỚI",icon:"sparkles",color:C.theme.teal,tEn:"Short line in English.",tVi:"Một câu giới thiệu ngắn.",steps:[{vi:"Bước đầu tiên.",en:"First step."}],locVi:"Địa điểm",locEn:"Location",locShort:"Địa điểm"});saveDraft();go("detail",C.stations.length-1);return}
  if(a==="delStation"){if(confirm("Xoá trạm "+pad(i+1)+"?")){C.stations.splice(i,1);if(state.i>=C.stations.length)state.i=Math.max(0,C.stations.length-1);saveDraft();render()}return}
  if(a==="up"&&i>0){C.stations.splice(i-1,0,C.stations.splice(i,1)[0]);saveDraft();render();return}
  if(a==="down"&&i<C.stations.length-1){C.stations.splice(i+1,0,C.stations.splice(i,1)[0]);saveDraft();render();return}
  if(a==="addStep"){s.steps.push({vi:"Bước mới.",en:"New step."});saveDraft();render();return}
  if(a==="delStep"){s.steps.splice(k,1);saveDraft();render();return}
  if(a==="download"){const blob=new Blob([JSON.stringify(C,null,2)+"\n"],{type:"application/json"});const u=URL.createObjectURL(blob);const link=document.createElement("a");link.href=u;link.download="content.json";link.click();URL.revokeObjectURL(u);toast("Đã tải content.json — thay file này lên GitHub.");return}
  if(a==="reset"){if(confirm("Bỏ mọi thay đổi chưa đăng và tải lại bản trên máy chủ?")){try{localStorage.removeItem(DRAFT_KEY)}catch(e2){}location.reload()}return}
  if(a==="exit"){state.edit=false;history.replaceState(null,"",location.pathname+(state.view==="detail"?"#tram-"+pad(state.i+1):state.view==="overview"?"#tram":""));editBar();render();toast("Đang xem thử. Thêm #edit vào URL để sửa tiếp.");return}
});

function render(){
  C.ui=Object.assign({},UI_DEF,C.ui||{});U=C.ui;
  applyTheme();chrome();
  document.body.classList.toggle("home",state.view==="home");
  document.getElementById("foot").style.display=state.view==="home"?"none":"flex";
  document.getElementById("view").innerHTML =
    state.view==="home"?homeView():state.view==="overview"?overviewView():state.view==="rewards"?rewardsView():detailView();
  editBar();
  const tabs=document.querySelector(".tabs"),on=tabs&&tabs.querySelector(".tab.on");
  if(tabs&&on)tabs.scrollLeft=Math.max(0,on.offsetLeft-20);
  if(!state.edit){
    const h=state.view==="detail"?("#tram-"+pad(state.i+1)):state.view==="overview"?"#tram":state.view==="rewards"?"#qua":"";
    history.replaceState(null,"",location.pathname+h);
  }
}

(async function init(){
  const fb=JSON.parse(document.getElementById("fallback-content").textContent);
  try{const r=await fetch("content.json",{cache:"no-store"});C=r.ok?await r.json():fb}catch(e){C=fb}
  const hash=location.hash;
  state.edit=hash.indexOf("edit")>-1;
  if(state.edit){try{const d=localStorage.getItem(DRAFT_KEY);if(d&&confirm("Có bản nháp chưa đăng trên máy này. Mở lại bản nháp?"))C=JSON.parse(d)}catch(e){}}
  const m=hash.match(/#tram-(\d+)/);
  if(m){state.view="detail";state.i=Math.min(Math.max(+m[1]-1,0),C.stations.length-1)}
  else if(hash.indexOf("qua")>-1||hash.indexOf("reward")>-1)state.view="rewards";
  else if(hash.indexOf("tram")>-1)state.view="overview";
  render();
})();
</script>
</body>
</html>
